<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="./assets/styles/style.css">
</head>

<body>
  <header><!--This is the header--></header>
  <main>
    <section>
      <div class="user">
        <div class="user-img">
          <img src="./assets/images/avatar-jessica.jpeg" alt="User Image">
        </div>
        <article>
          <h1 class="heading">Banini D. M. Augustine</h1>
          <p class="location">Accra, Ghana</p>
          <p class="job">
            "Front-end developer and Graphic Designer."
          </p>
        </article>
      </div>
      <nav class="user-links-box">
        <a href="#" class="link"><p class="nav-link-btn" tabindex="0">GitHub</p></a>
        <a href="#" class="link"><p class="nav-link-btn" tabindex="0">Frontend Mentor</p></a>
        <a href="#" class="link"><p class="nav-link-btn" tabindex="0">LinkedIn</p></a>
        <a href="#" class="link"><p class="nav-link-btn" tabindex="0">Twitter</p></a>
        <a href="#" class="link"><p class="nav-link-btn" tabindex="0">Instagram</p></a>
      </nav>
    </section>
  </main>
  <footer><!--This is the footer--></footer>
  <aside class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Banini-AD</a>.
  </aside>
</body>

</html>
